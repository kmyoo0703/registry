<div id="toast"></div>

<script>

const toast=document.getElementById("toast");
const bird=document.getElementById("bird");

function showToast(text){
  toast.textContent=text;
  toast.classList.add("show");
  clearTimeout(window.toastTimer);
  window.toastTimer=setTimeout(()=>{
    toast.classList.remove("show");
  },2000);
}

function flyBird(){
  bird.classList.remove("fly");
  void bird.offsetWidth;
  bird.classList.add("fly");
}

function fallbackCopy(text){
  const ta=document.createElement("textarea");
  ta.value=text;
  ta.style.position="fixed";
  ta.style.opacity="0";
  document.body.appendChild(ta);
  ta.focus();
  ta.select();
  let ok=false;
  try{
    ok=document.execCommand("copy");
  }catch(e){
    ok=false;
  }
  document.body.removeChild(ta);
  return ok;
}

async function copyToClipboard(text){
  if(navigator.clipboard && window.isSecureContext){
    try{
      await navigator.clipboard.writeText(text);
      return true;
    }catch(e){
      return fallbackCopy(text);
    }
  }else{
    return fallbackCopy(text);
  }
}

document.getElementById("father").addEventListener("click", async ()=>{
  const ok = await copyToClipboard("1002239470141");
  if(ok){
    showToast("부 계좌번호가 복사되었습니다.");
    flyBird();
  }else{
    showToast("복사에 실패했습니다.");
  }
});

document.getElementById("mother").addEventListener("click", async ()=>{
  const ok = await copyToClipboard("29819040468");
  if(ok){
    showToast("모 계좌번호가 복사되었습니다.");
    flyBird();
  }else{
    showToast("복사에 실패했습니다.");
  }
});

</script>
